name: Build KnockSense

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build app
        run: ./build.sh

      - name: Zip app
        run: cd build && ditto -c -k --keepParent KnockSense.app KnockSense.zip

      - uses: actions/upload-artifact@v4
        with:
          name: KnockSense
          path: build/KnockSense.zip

      - name: Publish "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest build/KnockSense.zip \
            --title "KnockSense (latest build)" \
            --notes "Download **KnockSense.zip**, unzip it and drag KnockSense.app into Applications.

          The first time, macOS will block it because it isn't from the App Store. To open it:
          - Right-click KnockSense.app → **Open** → **Open**, or
          - If there's no Open button: System Settings → Privacy & Security → scroll down → **Open Anyway**.

          Built from commit ${GITHUB_SHA::7}."
